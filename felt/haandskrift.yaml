# Feltdefinisjon for kjeden. Prospektivt felt, fase 4 (ADDENDUM-26) — utenfor PREREG-ens fire.
# OpenAlex har ingen topic for paleografi, kodikologi eller tekstkritikk: feltnære søk samler seg i
# T10595 og T14210 (begge godkjent 5/5 i ADDENDUM-01). Feltet avgrenses derfor i tillegg med et
# ordfilter på tittelen, og godkjenningsregelen er anvendt på rammen selv (5/5, 02.10.2026).
# Filteret står i `harvest/coverage.py` (PROSPEKTIVE_FELT) og i rammens manifestrad.

