  sha256: 3a9389959ba3ea6cd3cf11ac05fb3d7604738a1514171248c36a706e7a4f852c
  rader: 66440
  krav: hentbar                            # is_oa true OG fulltekst faktisk hentbar

terskler:
  n_verk: 25                        # trukket per felt (ADDENDUM-09)
  gulv: 25   # måleskranke i treffstratumet, ikke vekting (LAERDOM §15)
