# Feltdefinisjon for kjeden. Alt som gjør et felt til et felt, står her — ingenting i kode.
# Topics er hentet fra spørringen i det FROSNE rådata-manifestet, ikke fra verkenes egne
# primary_topic: `data/raw/MANIFEST.md` fører kilde-URL med `topics.id:` per kall, og den URL-en
# er det som definerte rammen. Rammelistens sha256 er kilden til at listen ikke har flyttet seg.

felt: tekstvitenskap
